name: CI Pipeline

on:
  push:
    branches: [main, develop, test-protection]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test HTML exists
        run: |
          if [ ! -f index.html ]; then
            echo "index.html missing"
            exit 1
          fi

      - name: Test CSS exists
        run: |
          if [ -f style.css ]; then
            echo "style.css found"
          else
            echo "style.css not found (optional)"
          fi

      - name: Build Docker image
        run: docker build -t mon-site .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mon-site