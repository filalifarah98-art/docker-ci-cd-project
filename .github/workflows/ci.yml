name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. TESTS (HTML/CSS simple)
      - name: Test HTML exists
        run: |
          if [ ! -f index.html ]; then
            echo "index.html missing"
            exit 1
          fi

      - name: Test CSS exists
        run: |
          if [ ! -f style.css ]; then
            echo "style.css missing"
            exit 1
          fi

      # 3. BUILD DOCKER
      - name: Build Docker image
        run: docker build -t mon-site .

      # 4. SECURITY SCAN (BONUS ⭐)
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mon-site